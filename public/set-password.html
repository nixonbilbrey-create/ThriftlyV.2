<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — Thriftly</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:400px;margin:80px auto;text-align:center;color:#1c1a17;padding:0 20px;}
  card{display:block;}
  .card{border:1px solid #e6e2d8;border-radius:10px;padding:24px;margin-top:20px;text-align:left;}
  input{width:100%;border:1px solid #e6e2d8;border-radius:7px;padding:8px 10px;font:inherit;font-size:13px;margin-bottom:8px;box-sizing:border-box;}
  button{padding:9px 16px;border-radius:8px;border:none;background:#1c1a17;color:#fff;cursor:pointer;font-weight:600;font-size:13.5px;}
  button:disabled{opacity:.45;cursor:default;}
  .err{color:#a8462f;font-size:12.5px;margin:4px 0;}
  .msg{color:#54704A;font-size:13px;margin:6px 0;}
  p{color:#4a4438;font-size:14px;line-height:1.5;}
  a{display:inline-block;margin-top:14px;background:#1c1a17;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;}
</style>
</head>
<body>
  <h1 id="heading">Set a new password</h1>
  <div id="formCard" class="card">
    <p style="font-size:13px;margin-top:0;">Choose a new password for your Thriftly account. This link can only be used once and expires after 1 hour.</p>
    <input id="password" type="password" placeholder="New password (min 8 characters)">
    <input id="confirm" type="password" placeholder="Repeat new password">
    <div class="err" id="err"></div>
    <button id="submit">Set password</button>
  </div>
  <div id="doneView" style="display:none;">
    <p id="doneMsg"></p>
    <a href="/">Continue to Thriftly</a>
  </div>
  <div id="badTokenView" style="display:none;">
    <p id="badTokenMsg"></p>
    <a href="/">Back to Thriftly</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';

    function esc(s) {
      return String(s ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));
    }

    if (!token) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('heading').textContent = 'Password reset';
      document.getElementById('badTokenMsg').textContent = 'This reset link is missing its token. Request a new reset link from the login page.';
      document.getElementById('badTokenView').style.display = 'block';
    }

    document.getElementById('submit').addEventListener('click', async () => {
      const errBox = document.getElementById('err');
      errBox.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { errBox.textContent = 'Passwords don\\'t match'; return; }
      if (password.length < 8) { errBox.textContent = 'Password must be at least 8 characters'; return; }

      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = 'Setting password…';
      try {
        const res = await fetch('/api/auth/set-password', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error || 'Something went wrong';
          if (res.status === 400 && /invalid or has expired/i.test(data.error || '')) {
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('badTokenMsg').textContent = data.error;
            document.getElementById('badTokenView').style.display = 'block';
            document.getElementById('heading').textContent = 'Password reset';
            return;
          }
          return;
        }
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('heading').textContent = '✅ Password updated';
        document.getElementById('doneMsg').textContent = data.message || 'Your password has been updated.';
        document.getElementById('doneView').style.display = 'block';
      } catch (err) {
        errBox.textContent = 'Request failed: ' + err;
      } finally {
        btn.disabled = false; btn.textContent = 'Set password';
      }
    });
  </script>
</body>
</html>
