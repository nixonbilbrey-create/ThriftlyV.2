<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — Thriftly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,system-ui,sans-serif;
    background:#f5f5f7;color:#1d1d1f;
    max-width:420px;margin:0 auto;padding:72px 20px;
    -webkit-font-smoothing:antialiased;text-align:center;
  }
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 18px;}
  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.06);text-align:left;}
  p{color:#6e6e73;font-size:13.5px;line-height:1.55;margin:0 0 14px;}
  label.check{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:#3a3a3c;margin:4px 0 10px;}
  label.check input{margin-top:2px;width:auto;}
  input{
    width:100%;border:1px solid #d2d2d7;border-radius:12px;padding:10px 12px;
    font:inherit;font-size:14px;margin-bottom:10px;box-sizing:border-box;background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{outline:none;border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.18);}
  label.check input{accent-color:#0071e3;}
  button{
    width:100%;padding:11px 16px;border-radius:980px;border:none;background:#0071e3;color:#fff;
    cursor:pointer;font-weight:600;font-size:14px;transition:background .15s, transform .05s;
  }
  button:hover{background:#0077ed;}
  button:active{transform:scale(.98);}
  button:disabled{opacity:.45;cursor:default;}
  .err{color:#ff3b30;font-size:13px;margin:2px 0;}
  .done{color:#248a3d;font-size:14px;margin:6px 0;}
  a{
    display:inline-block;margin-top:14px;background:#0071e3;color:#fff;text-decoration:none;
    padding:10px 20px;border-radius:980px;font-size:14px;font-weight:600;
  }
  a.ghost{background:transparent;color:#0071e3;}
  a.ghost:hover{text-decoration:underline;}
</style>
</head>
<body>
  <h1 id="heading">Set a new password</h1>
  <div id="formCard" class="card">
    <p>Choose a new password for your Thriftly account. This link can only be used once and expires after 1 hour.</p>
    <input id="password" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password">
    <input id="confirm" type="password" placeholder="Repeat new password" autocomplete="new-password">
    <div class="err" id="err"></div>
    <button id="submit">Set password</button>
  </div>
  <div id="doneView" style="display:none;">
    <div class="card" style="text-align:center;">
      <p class="done" id="doneMsg"></p>
      <a href="/">Continue to Thriftly</a>
    </div>
  </div>
  <div id="badTokenView" style="display:none;">
    <div class="card" style="text-align:center;">
      <p id="badTokenMsg"></p>
      <a class="ghost" href="/">Back to Thriftly</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    if (!token) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('heading').textContent = 'Password reset';
      document.getElementById('badTokenMsg').textContent = 'This reset link is missing its token. Request a new reset link from the login page.';
      document.getElementById('badTokenView').style.display = 'block';
    }

    document.getElementById('submit').addEventListener('click', async () => {
      const errBox = document.getElementById('err');
      errBox.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { errBox.textContent = 'Passwords don\'t match'; return; }
      if (password.length < 8) { errBox.textContent = 'Password must be at least 8 characters'; return; }

      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = 'Setting password…';
      try {
        const res = await fetch('/api/auth/set-password', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error || 'Something went wrong';
          if (res.status === 400 && /invalid or has expired/i.test(data.error || '')) {
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('badTokenMsg').textContent = data.error;
            document.getElementById('badTokenView').style.display = 'block';
            document.getElementById('heading').textContent = 'Password reset';
            return;
          }
          return;
        }
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('heading').textContent = 'Password updated';
        document.getElementById('doneMsg').textContent = data.message || 'Your password has been updated.';
        document.getElementById('doneView').style.display = 'block';
      } catch (err) {
        errBox.textContent = 'Request failed: ' + err;
      } finally {
        btn.disabled = false; btn.textContent = 'Set password';
      }
    });
  </script>
</body>
</html>
