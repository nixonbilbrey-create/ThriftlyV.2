# Render Blueprints spec — deploy with "New +" → Blueprint, or the manifest is
# picked up automatically.
#
# No persistent disk. With DATABASE_URL set, accounts and drafts live in Supabase
# Postgres and photos in a private Supabase Storage bucket, so the container is
# disposable: a redeploy, a restart or a second instance changes nothing. The
# app refuses to boot in production with DATABASE_URL but no Storage credentials,
# which is what keeps photos off this ephemeral filesystem.
services:
  - type: web
    name: thriftly
    runtime: docker
    plan: starter
    # Render restarts the service when this fails, so it stays a liveness check;
    # the database ping lives on /api/ready, which the uptime monitor watches.
    healthCheckPath: /api/health
    envVars:
      - key: ENCRYPTION_KEY
        sync: false # 64-char hex: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: BASE_URL
        sync: false # set AFTER first deploy to the onrender.com (or custom) URL so email links point at the right origin
      - key: SMTP_HOST
        sync: false # e.g. smtp-relay.brevo.com
      - key: SMTP_PORT
        sync: false # 587
      - key: SMTP_SECURE
        sync: false # false for STARTTLS on 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false # your verified sender address
      # TEMPORARY: there is no mail relay yet, so signup signs people in straight
      # away and nobody proves they own their address. Set this back to "true" (or
      # delete the entry) the moment SMTP works — it is what keeps throwaway and
      # misspelled addresses out, and what makes password reset reach a real inbox.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: GEMINI_MODEL
        sync: false # optional override; defaults in gemini.js
      - key: TURNSTILE_SITE_KEY
        sync: false # public site key — leave blank to keep the CAPTCHA off
      - key: TURNSTILE_SECRET
        sync: false # set WITH the site key; fails closed when configured
      # Supabase — required. DATABASE_URL selects the Postgres data layer;
      # the Storage trio is what the boot guard insists on. See docs/SUPABASE.md.
      - key: DATABASE_URL
        sync: false # Supabase session pooler URI (port 5432), not the direct IPv6 host
      - key: SUPABASE_URL
        sync: false # https://<ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # server-only; never expose to the browser
      - key: SUPABASE_STORAGE_BUCKET
        value: photos
    maxShutdownDelaySeconds: 30
    autoDeploy: true
