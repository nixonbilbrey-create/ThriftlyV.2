<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — Thriftly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/theme.css">
</head>
<body class="center-page">
  <header class="site-head">
    <a class="brand" href="/">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2V4.6A1.6 1.6 0 0 1 4.6 3h6.6c.42 0 .82.17 1.12.47l8.2 8.2a1.6 1.6 0 0 1 0 2.26l-6.1 6.1a1.6 1.6 0 0 1-2.26 0l-8.2-8.2A1.6 1.6 0 0 1 3 11.2Z" fill="#d8fa4f" stroke="#14140f" stroke-width="2"/><circle cx="8.1" cy="8.1" r="1.7" fill="#14140f"/></svg>
      Thriftly
    </a>
    <span class="brand-tag">snap · price · list</span>
  </header>

  <h1 id="heading">Set a new password</h1>
  <div id="formCard" class="card">
    <p>Choose a new password for your Thriftly account. This link can only be used once and expires after 1 hour.</p>
    <div class="field">
      <input id="password" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password">
      <button type="button" class="reveal" data-for="password" aria-controls="password" aria-pressed="false">Show</button>
    </div>
    <div class="field">
      <input id="confirm" type="password" placeholder="Repeat new password" autocomplete="new-password">
      <button type="button" class="reveal" data-for="confirm" aria-controls="confirm" aria-pressed="false">Show</button>
    </div>
    <div class="err" id="err"></div>
    <button id="submit">Set password</button>
  </div>
  <div id="doneView" style="display:none;">
    <div class="card" style="text-align:center;">
      <p class="done" id="doneMsg"></p>
      <a href="/">Continue to Thriftly</a>
    </div>
  </div>
  <div id="badTokenView" style="display:none;">
    <div class="card" style="text-align:center;">
      <p id="badTokenMsg"></p>
      <a class="ghost" href="/">Back to Thriftly</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    if (!token) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('heading').textContent = 'Password reset';
      document.getElementById('badTokenMsg').textContent = 'This reset link is missing its token. Request a new reset link from the login page.';
      document.getElementById('badTokenView').style.display = 'block';
    }

    document.getElementById('submit').addEventListener('click', async () => {
      const errBox = document.getElementById('err');
      errBox.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { errBox.textContent = 'Passwords don\'t match'; return; }
      if (password.length < 8) { errBox.textContent = 'Password must be at least 8 characters'; return; }

      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = 'Setting password…';
      try {
        const res = await fetch('/api/auth/set-password', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error || 'Something went wrong';
          if (res.status === 400 && /invalid or has expired/i.test(data.error || '')) {
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('badTokenMsg').textContent = data.error;
            document.getElementById('badTokenView').style.display = 'block';
            document.getElementById('heading').textContent = 'Password reset';
            return;
          }
          return;
        }
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('heading').textContent = 'Password updated';
        document.getElementById('doneMsg').textContent = data.message || 'Your password has been updated.';
        document.getElementById('doneView').style.display = 'block';
      } catch (err) {
        errBox.textContent = 'Request failed: ' + err;
      } finally {
        btn.disabled = false; btn.textContent = 'Set password';
      }
    });

    // The same always-visible reveal as the sign-in form: two hidden fields are
    // exactly where "passwords don't match" mistakes come from.
    document.querySelectorAll('.field .reveal').forEach((button) => {
      const input = document.getElementById(button.dataset.for);
      button.addEventListener('click', () => {
        const hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        button.textContent = hidden ? 'Hide' : 'Show';
        button.setAttribute('aria-pressed', String(hidden));
        input.focus();
      });
    });
  </script>
</body>
</html>
